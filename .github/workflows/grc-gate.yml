name: GRC Policy Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      execute:
        description: Run Terraform apply and publish signed evidence
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: grc-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "393036064603"

  AWS_PLAN_ROLE_ARN: "arn:aws:iam::393036064603:role/cgep-capstone-github-plan"
  AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::393036064603:role/cgep-capstone-github-deploy"

  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: "cgep-capstone-colby-hin-tfstate-393036064603"
  TF_STATE_KEY: "cgep-capstone/terraform.tfstate"
  TERRAFORM_VERSION: "1.15.8"

  EVIDENCE_BUCKET: "acme-health-intake-evidence-e8072135"
  CAPSTONE_KMS_KEY_ARN: "arn:aws:kms:us-east-1:393036064603:key/3771d798-9fac-44e5-8f41-9443cd0d9c4a"

  OPA_VERSION: "1.9.0"
  CONFTEST_VERSION: "0.69.0"

jobs:
  policy-gate:
    name: Terraform Plan and Rego Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install OPA and Conftest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.local/bin"

          curl -fsSLo /tmp/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"

          install -m 0755 \
            /tmp/opa \
            "${HOME}/.local/bin/opa"

          curl -fsSLo /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"

          tar -xzf /tmp/conftest.tar.gz \
            -C /tmp \
            conftest

          install -m 0755 \
            /tmp/conftest \
            "${HOME}/.local/bin/conftest"

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify tool versions
        shell: bash
        run: |
          set -euo pipefail

          terraform version
          opa version
          conftest --version
          jq --version
          aws --version

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cgep-plan-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

      - name: Check Terraform formatting
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform fmt -check -recursive

      - name: Check Rego formatting and syntax
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(opa fmt --diff policies)"
          opa check --strict policies

      - name: Run Terraform and Conftest policy gate
        shell: bash
        run: |
          set -euo pipefail

          export TF_CLI_ARGS_init="\
          -backend-config=bucket=${TF_STATE_BUCKET} \
          -backend-config=key=${TF_STATE_KEY} \
          -backend-config=region=${AWS_REGION} \
          -backend-config=use_lockfile=true"

          ./scripts/policy-gate.sh |
            tee /tmp/grc-policy-gate.txt

          grep -F \
            "PASS: Terraform plan satisfies all five compliance policies." \
            /tmp/grc-policy-gate.txt

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GRC Policy Gate"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- AWS authentication: GitHub OIDC"
            echo "- Terraform backend: versioned S3 with native locking"
            echo "- Policies evaluated: 5"
            echo "- OPA unit tests: 10"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-evidence:
    needs: policy-gate
    name: Plan, Gate, Apply, Sign and Vault
    if: ${{ needs.policy-gate.result == 'success' && (github.event_name == 'push' || inputs.execute == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install OPA and Conftest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.local/bin"

          curl -fsSLo /tmp/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"

          install -m 0755 \
            /tmp/opa \
            "${HOME}/.local/bin/opa"

          curl -fsSLo /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"

          tar -xzf /tmp/conftest.tar.gz \
            -C /tmp \
            conftest

          install -m 0755 \
            /tmp/conftest \
            "${HOME}/.local/bin/conftest"

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify tool versions
        shell: bash
        run: |
          set -euo pipefail

          terraform version
          opa version
          conftest --version
          cosign version
          jq --version
          aws --version

      - name: Obtain deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cgep-deploy-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Validate source and policy tests
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform fmt -check -recursive
          test -z "$(opa fmt --diff policies)"
          opa check --strict policies
          opa test policies

      - name: Initialize Terraform backend
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform init \
            -input=false \
            -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

          terraform -chdir=terraform validate -no-color

      - name: Create Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform plan \
            -input=false \
            -no-color \
            -out="${RUNNER_TEMP}/cgep.tfplan" \
            | tee "${RUNNER_TEMP}/terraform-plan.txt"

          terraform -chdir=terraform show \
            -json \
            "${RUNNER_TEMP}/cgep.tfplan" \
            > "${RUNNER_TEMP}/terraform-plan.json"

      - name: Enforce Conftest gate
        shell: bash
        run: |
          set -euo pipefail

          conftest test \
            "${RUNNER_TEMP}/terraform-plan.json" \
            --policy policies \
            | tee "${RUNNER_TEMP}/conftest.txt"

      - name: Apply reviewed Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform apply \
            -input=false \
            -no-color \
            "${RUNNER_TEMP}/cgep.tfplan" \
            | tee "${RUNNER_TEMP}/terraform-apply.txt"

      - name: Obtain read-only evidence credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cgep-evidence-read-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Generate evidence bundle
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE_ROOT="${RUNNER_TEMP}/cgep-evidence"

          rm -rf "${EVIDENCE_ROOT}"
          mkdir -p "${EVIDENCE_ROOT}"

          ./scripts/evidence-bundle.sh "${EVIDENCE_ROOT}" \
            | tee "${RUNNER_TEMP}/evidence-bundle.txt"

          EVIDENCE_ARCHIVE="$(
            find "${EVIDENCE_ROOT}" \
              -maxdepth 1 \
              -type f \
              -name 'cgep-evidence-*.tar.gz' \
              | head -n 1
          )"

          test -n "${EVIDENCE_ARCHIVE}"
          test -f "${EVIDENCE_ARCHIVE}.sha256"

          COSIGN_BUNDLE="${EVIDENCE_ARCHIVE}.sigstore.json"
          UPLOAD_RECEIPT="${RUNNER_TEMP}/evidence-upload-receipt.json"
          RECEIPT_UPLOAD_RECEIPT="${RUNNER_TEMP}/receipt-upload-receipt.json"

          EVIDENCE_PREFIX="evidence/${GITHUB_REPOSITORY}/${GITHUB_SHA}/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"

          {
            echo "EVIDENCE_ARCHIVE=${EVIDENCE_ARCHIVE}"
            echo "EVIDENCE_ARCHIVE_SHA256=${EVIDENCE_ARCHIVE}.sha256"
            echo "COSIGN_BUNDLE=${COSIGN_BUNDLE}"
            echo "UPLOAD_RECEIPT=${UPLOAD_RECEIPT}"
            echo "RECEIPT_UPLOAD_RECEIPT=${RECEIPT_UPLOAD_RECEIPT}"
            echo "EVIDENCE_PREFIX=${EVIDENCE_PREFIX}"
          } >> "${GITHUB_ENV}"

      - name: Sign evidence with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          cosign sign-blob \
            --yes \
            --bundle "${COSIGN_BUNDLE}" \
            "${EVIDENCE_ARCHIVE}"

          test -s "${COSIGN_BUNDLE}"

      - name: Verify evidence signature
        shell: bash
        run: |
          set -euo pipefail

          SIGNER_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/grc-gate.yml@${GITHUB_REF}"

          cosign verify-blob \
            "${EVIDENCE_ARCHIVE}" \
            --bundle "${COSIGN_BUNDLE}" \
            --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            | tee "${RUNNER_TEMP}/cosign-verification.txt"

      - name: Restore deployment credentials for vault upload
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cgep-evidence-upload-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Upload signed artifacts to Object Lock vault
        shell: bash
        run: |
          set -euo pipefail

          RECEIPT_PATH="${UPLOAD_RECEIPT}" \
            ./scripts/evidence-upload.sh \
              "${EVIDENCE_BUCKET}" \
              "${CAPSTONE_KMS_KEY_ARN}" \
              "${EVIDENCE_PREFIX}" \
              "${EVIDENCE_ARCHIVE}" \
              "${EVIDENCE_ARCHIVE_SHA256}" \
              "${COSIGN_BUNDLE}"

          jq -e \
            '.artifacts | length == 3' \
            "${UPLOAD_RECEIPT}" \
            >/dev/null

      - name: Upload primary receipt to Object Lock vault
        shell: bash
        run: |
          set -euo pipefail

          RECEIPT_PATH="${RECEIPT_UPLOAD_RECEIPT}" \
            ./scripts/evidence-upload.sh \
              "${EVIDENCE_BUCKET}" \
              "${CAPSTONE_KMS_KEY_ARN}" \
              "${EVIDENCE_PREFIX}" \
              "${UPLOAD_RECEIPT}"

          jq -e \
            '.artifacts | length == 1' \
            "${RECEIPT_UPLOAD_RECEIPT}" \
            >/dev/null

      - name: Preserve workflow evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cgep-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.EVIDENCE_ARCHIVE }}
            ${{ env.EVIDENCE_ARCHIVE_SHA256 }}
            ${{ env.COSIGN_BUNDLE }}
            ${{ env.UPLOAD_RECEIPT }}
            ${{ env.RECEIPT_UPLOAD_RECEIPT }}
            ${{ runner.temp }}/terraform-plan.txt
            ${{ runner.temp }}/terraform-plan.json
            ${{ runner.temp }}/terraform-apply.txt
            ${{ runner.temp }}/conftest.txt
            ${{ runner.temp }}/cosign-verification.txt
            ${{ runner.temp }}/evidence-bundle.txt

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GRC Deployment and Evidence"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo "- AWS authentication: GitHub OIDC"
            echo "- Policy gate: OPA and Conftest"
            echo "- Signature: keyless Cosign bundle"
            echo "- Evidence destination: S3 Object Lock vault"
            echo "- Evidence prefix: \`${EVIDENCE_PREFIX:-not-created}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
